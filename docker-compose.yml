# docker-compose.yml
services:
  # Browser for manual account login (Jalur A)
  # Open http://localhost:6080 to see the Chrome window and log in manually.
  browser_login:
    build:
      context: .
      dockerfile: docker/novnc/Dockerfile
    ports:
      - "6080:6080"
      - "9222:9222"
    volumes:
      - browser_profiles:/data/profile
    environment:
      - DISPLAY=:99
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "curl -s http://localhost:9222/json/version || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s



  # Redis - Task Queue Backend
  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # RedisInsight - Dashboard Visualizer
  redisinsight:
    image: redislabs/redisinsight:latest
    ports:
      - "8001:8001"
    volumes:
      - redis_insight_data:/db
    depends_on:
      - redis
    restart: unless-stopped

  # MongoDB - Product Database (Optional)
  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Ollama - Local AI
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Celery Worker - Background Tasks
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A services.task_queue.worker worker --loglevel=info --concurrency=4
    depends_on:
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    environment:
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_HOST=http://ollama:11434
      - ENABLE_X_POST=true
      - ENABLE_FB_POST=true
      - ENABLE_TIKTOK_POST=true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # FastAPI API Server
  api_server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      celery_worker:
        condition: service_started
      ollama:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_HOST=http://ollama:11434
      - DEBUG=false
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Scrape Scheduler (Optional Cron)
  schedule_cron:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -u utils/scheduler.py
    depends_on:
      - redis
      - celery_worker
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
    restart: unless-stopped

volumes:
  browser_profiles:
  redis_data:
  redis_insight_data:
  mongo_data:
  ollama_data:
